# Alembic migrations for MariaDB
# Usage: alembic revision --autogenerate -m "message" / alembic upgrade head

[alembic]
# Directory containing this ini file (env.py, versions/)
script_location = %(here)s
# backend/ (for import app)
prepend_sys_path = ..
version_path_separator = os

# The DB URL is loaded from app.config in env.py.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
